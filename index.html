<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Thai Chess UI</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

html{
    -webkit-text-size-adjust:100%;
}

body{

    min-height:100vh;

    font-family:
        "Sarabun",
        "Noto Sans Thai",
        Tahoma,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            #6d4728 0%,
            #382315 65%,
            #24150d 100%
        );

    color:#fff;

    display:flex;

    justify-content:center;

    padding:12px;

}


/* =========================================================
   MAIN
========================================================= */

.game{

    width:100%;

    max-width:620px;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-bottom:12px;

}


.title-area{

    display:flex;

    align-items:center;

    gap:10px;

}


.title-icon{

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:34px;

    color:#f8ead5;

}


.title-text{

    line-height:1.1;

}


.title{

    font-size:20px;

    font-weight:700;

    color:#fff8ed;

}


.subtitle{

    margin-top:4px;

    font-size:11px;

    color:#cdb18e;

}


/* =========================================================
   STATUS
========================================================= */

.status{

    display:flex;

    align-items:center;

    gap:7px;

    padding:8px 13px;

    background:
        linear-gradient(
            #fffaf1,
            #e8d4b6
        );

    border:1px solid #b48a5c;

    border-radius:20px;

    color:#52361d;

    font-size:12px;

    font-weight:700;

    box-shadow:
        0 3px 8px rgba(0,0,0,.28);

    white-space:nowrap;

}


.status-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#55a84f;

}


/* =========================================================
   BOARD FRAME

   สำคัญ:
   ใช้ aspect-ratio + width เพียงชุดเดียว
   ไม่ให้ content ภายในดันขนาด
========================================================= */

.board-frame{

    width:min(
        94vw,
        560px
    );

    aspect-ratio:1 / 1;

    margin:
        0 auto;

    padding:8px;

    background:
        linear-gradient(
            145deg,
            #a76c35 0%,
            #71431f 45%,
            #432512 100%
        );

    border:2px solid #b17a43;

    border-radius:10px;

    box-shadow:

        0 18px 35px
        rgba(0,0,0,.42),

        inset 0 2px 2px
        rgba(255,255,255,.18);

}


/* =========================================================
   BOARD

   ทุกช่องมีขนาดเท่ากันตลอด
========================================================= */

#board{

    width:100%;
    height:100%;

    display:grid;

    grid-template-columns:
        repeat(8, minmax(0,1fr));

    grid-template-rows:
        repeat(8, minmax(0,1fr));

    overflow:hidden;

    border:2px solid #452713;

    border-radius:3px;

    isolation:isolate;

}


/* =========================================================
   CELL
========================================================= */

.cell{

    position:relative;

    width:100%;
    height:100%;

    min-width:0;
    min-height:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    user-select:none;

}


/* =========================================================
   WOOD BOARD

   ใช้สีต่างกันแบบนุ่ม ไม่ contrast จัดเกินไป
========================================================= */

.cell.light{

    background:

        linear-gradient(
            135deg,
            #efc98f 0%,
            #e5b978 48%,
            #dcae69 100%
        );

}


.cell.dark{

    background:

        linear-gradient(
            135deg,
            #ae6f3b 0%,
            #965a2d 50%,
            #875029 100%
        );

}


/* ลายไม้ */

.cell::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.13;

    background:

        repeating-linear-gradient(
            8deg,
            transparent 0px,
            transparent 9px,
            rgba(75,38,14,.32) 10px,
            transparent 12px
        );

}


/* ขอบด้านในช่อง */

.cell::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    border:
        1px solid
        rgba(255,255,255,.035);

}


/* =========================================================
   SELECTED CELL
========================================================= */

.cell.selected{

    background:
        linear-gradient(
            135deg,
            #d8d98a,
            #b7bc68
        ) !important;

}


/* =========================================================
   PIECE CONTAINER

   absolute เพื่อไม่ให้ตัวหมากดัน layout
========================================================= */

.piece{

    position:absolute;

    left:8%;
    top:8%;

    width:84%;
    height:84%;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:5;

    pointer-events:none;

}


/* SVG */

.piece svg{

    width:100%;
    height:100%;

    display:block;

}


/* =========================================================
   WHITE PIECES
========================================================= */

.piece-white{

    color:#f8f5ed;

    filter:
        drop-shadow(
            0 3px 2px rgba(46,25,12,.42)
        );

}


/* =========================================================
   BLACK PIECES
========================================================= */

.piece-black{

    color:#171311;

    filter:
        drop-shadow(
            0 2px 1px rgba(255,255,255,.08)
        );

}


/* =========================================================
   NO HOVER TRANSFORM

   สำคัญมาก:
   ไม่ให้กระดาน/หมากเด้งบนมือถือ
========================================================= */

.cell:hover .piece{

    transform:none;

}


/* =========================================================
   DEMO MOVE DOT
========================================================= */

.move-dot{

    position:absolute;

    z-index:4;

    width:15%;

    aspect-ratio:1;

    border-radius:50%;

    background:
        rgba(75,45,21,.48);

}


/* =========================================================
   CAPTURE RING
========================================================= */

.capture-ring{

    position:absolute;

    z-index:4;

    width:76%;
    height:76%;

    border-radius:50%;

    border:
        3px solid
        rgba(75,39,19,.42);

}


/* =========================================================
   BOTTOM
========================================================= */

.bottom{

    text-align:center;

    margin-top:12px;

}


.new-game{

    border:0;

    padding:
        9px 22px;

    border-radius:8px;

    font-family:inherit;

    font-size:13px;

    font-weight:700;

    color:#fff;

    background:
        linear-gradient(
            #ae7138,
            #78451f
        );

    border:
        1px solid #bd8650;

    box-shadow:
        0 4px 8px rgba(0,0,0,.25);

}


.hint{

    margin-top:7px;

    color:#c5a986;

    font-size:11px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

    body{

        padding:
            7px;

    }


    .header{

        margin-bottom:9px;

    }


    .title-icon{

        width:34px;
        height:34px;

        font-size:28px;

    }


    .title{

        font-size:17px;

    }


    .subtitle{

        font-size:9px;

    }


    .status{

        padding:
            7px 10px;

        font-size:10px;

    }


    .board-frame{

        width:
            calc(100vw - 14px);

        padding:6px;

        border-radius:8px;

    }

}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media(max-width:350px){

    .status{

        display:none;

    }

}

</style>

</head>


<body>


<div class="game">


    <!-- HEADER -->

    <div class="header">

        <div class="title-area">

            <div class="title-icon">
                ♞
            </div>

            <div class="title-text">

                <div class="title">
                    หมากรุกไทย
                </div>

                <div class="subtitle">
                    THAI CHESS • MAKRUK
                </div>

            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            ตาของคุณ

        </div>

    </div>


    <!-- BOARD -->

    <div class="board-frame">

        <div id="board"></div>

    </div>


    <div class="bottom">

        <button class="new-game">
            ↻ เริ่มเกมใหม่
        </button>

        <div class="hint">
            แตะตัวหมากเพื่อเริ่มเดิน
        </div>

    </div>


</div>


<script>

/* =========================================================
   PIECE SVG
   รูปทรงเน้น silhouette เรียบแบบภาพต้นแบบ
========================================================= */

function pieceSVG(type){

    const stroke = `
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linejoin="round"
        stroke-linecap="round"
    `;


    /* =====================================================
       ROOK
    ===================================================== */

    if(type === "R"){

        return `

        <svg viewBox="0 0 100 100">

            <path
                d="
                    M24 20
                    L37 20
                    L37 28
                    L47 28
                    L47 20
                    L53 20
                    L53 28
                    L63 28
                    L63 20
                    L76 20

                    L72 36

                    C70 41 67 44 67 48

                    L67 68

                    L76 76

                    L76 82

                    L24 82

                    L24 76

                    L33 68

                    L33 48

                    C33 44 30 41 28 36

                    Z
                "

                fill="currentColor"

                ${stroke}

            />

            <path
                d="
                    M32 68
                    L68 68
                "

                fill="none"

                stroke="rgba(255,255,255,.18)"

                stroke-width="3"

            />

        </svg>

        `;

    }


    /* =====================================================
       KNIGHT
    ===================================================== */

    if(type === "N"){

        return `

        <svg viewBox="0 0 100 100">

            <path
                d="
                    M27 82

                    L73 82

                    L73 75

                    L63 70

                    L60 61

                    C70 56 75 49 74 40

                    C73 29 65 20 55 17

                    L43 14

                    L35 20

                    L27 21

                    L32 30

                    L25 39

                    L31 48

                    L29 61

                    L23 73

                    Z
                "

                fill="currentColor"

                ${stroke}

            />

            <!-- หน้าม้า -->

            <path
                d="
                    M43 22
                    C51 20 59 23 64 30
                    C67 34 67 40 64 44
                "

                fill="none"

                stroke="rgba(255,255,255,.22)"

                stroke-width="3"

            />

            <!-- ตา -->

            <circle
                cx="57"
                cy="30"
                r="2.6"
                fill="#c58d4a"
            />

        </svg>

        `;

    }


    /* =====================================================
       KHON
    ===================================================== */

    if(type === "C"){

        return `

        <svg viewBox="0 0 100 100">

            <path
                d="
                    M50 13

                    C46 20 37 26 35 35

                    C32 46 38 52 40 58

                    L34 67

                    L26 73

                    L26 82

                    L74 82

                    L74 73

                    L66 67

                    L60 58

                    C62 52 68 46 65 35

                    C63 26 54 20 50 13

                    Z
                "

                fill="currentColor"

                ${stroke}

            />

            <path
                d="
                    M31 69
                    L69 69
                "

                fill="none"

                stroke="rgba(255,255,255,.18)"

                stroke-width="3"

            />

        </svg>

        `;

    }


    /* =====================================================
       KING
    ===================================================== */

    if(type === "K"){

        return `

        <svg viewBox="0 0 100 100">

            <!-- crown -->

            <path
                d="
                    M43 12
                    L57 12
                    L57 20
                    L65 20
                    L65 28
                    L57 28

                    C66 35 69 44 67 54

                    L66 63

                    L75 72

                    L75 82

                    L25 82

                    L25 72

                    L34 63

                    L33 54

                    C31 44 34 35 43 28

                    L35 28
                    L35 20
                    L43 20
                    Z
                "

                fill="currentColor"

                ${stroke}

            />

            <path
                d="
                    M37 31
                    L63 31
                "

                fill="none"

                stroke="rgba(255,255,255,.20)"

                stroke-width="3"

            />

            <path
                d="
                    M32 69
                    L68 69
                "

                fill="none"

                stroke="rgba(255,255,255,.18)"

                stroke-width="3"

            />

        </svg>

        `;

    }


    /* =====================================================
       MET
    ===================================================== */

    if(type === "M"){

        return `

        <svg viewBox="0 0 100 100">

            <path
                d="
                    M50 15

                    C44 22 38 28 37 36

                    C36 46 41 53 44 59

                    L37 68

                    L30 74

                    L30 82

                    L70 82

                    L70 74

                    L63 68

                    L56 59

                    C59 53 64 46 63 36

                    C62 28 56 22 50 15

                    Z
                "

                fill="currentColor"

                ${stroke}

            />

            <path
                d="
                    M36 70
                    L64 70
                "

                fill="none"

                stroke="rgba(255,255,255,.18)"

                stroke-width="3"

            />

        </svg>

        `;

    }


    /* =====================================================
       PAWN

       วงแหวนหลายชั้นแบบภาพต้นแบบ
    ===================================================== */

    if(type === "P"){

        return `

        <svg viewBox="0 0 100 100">

            <circle
                cx="50"
                cy="50"
                r="34"

                fill="currentColor"

                ${stroke}

            />

            <circle
                cx="50"
                cy="50"
                r="25"

                fill="none"

                stroke="#c58c4a"

                stroke-width="4"

            />

            <circle
                cx="50"
                cy="50"
                r="14"

                fill="none"

                stroke="#c58c4a"

                stroke-width="4"

            />

        </svg>

        `;

    }


    return "";

}


/* =========================================================
   START POSITION
========================================================= */

const pieces = [

    ["b-R","b-N","b-C","b-K","b-M","b-C","b-N","b-R"],

    [null,null,null,null,null,null,null,null],

    ["b-P","b-P","b-P","b-P","b-P","b-P","b-P","b-P"],

    [null,null,null,null,null,null,null,null],

    [null,null,null,null,null,null,null,null],

    ["w-P","w-P","w-P","w-P","w-P","w-P","w-P","w-P"],

    [null,null,null,null,null,null,null,null],

    ["w-R","w-N","w-C","w-K","w-M","w-C","w-N","w-R"]

];


/* =========================================================
   RENDER
========================================================= */

const board =
    document.getElementById("board");


for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

        const cell =
            document.createElement("div");


        cell.className =
            "cell " +
            (
                (r+c)%2===0
                    ? "light"
                    : "dark"
            );


        const value =
            pieces[r][c];


        if(value){

            const color =
                value[0];

            const type =
                value[2];


            const piece =
                document.createElement(
                    "div"
                );


            piece.className =
                "piece " +
                (
                    color==="w"
                        ? "piece-white"
                        : "piece-black"
                );


            piece.innerHTML =
                pieceSVG(type);


            cell.appendChild(
                piece
            );

        }


        board.appendChild(
            cell
        );

    }

}

</script>

</body>
</html>
